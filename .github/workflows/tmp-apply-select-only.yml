name: TEMP Apply selection-only picker

on:
  push:
    branches:
      - feature/select-only-picker
    paths:
      - .github/workflows/tmp-apply-select-only.yml
      - .github/scripts/apply-select-only.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/select-only-picker
          fetch-depth: 0
      - name: Apply production patch
        run: python .github/scripts/apply-select-only.py
      - name: Bash syntax
        run: bash -n awtwall tests/test-select-only.sh
      - name: Selection-only contract
        run: bash tests/test-select-only.sh
      - name: Diff validation
        run: git diff --check
      - name: Commit production patch
        run: |
          if git diff --quiet -- awtwall; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add awtwall
          git commit -m 'feat: add selection-only wallpaper picker mode'
          git push origin HEAD:feature/select-only-picker
