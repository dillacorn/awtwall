name: Selection-only development

on:
  push:
    branches:
      - feature/selection-only-picker

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selection-only-picker
          fetch-depth: 0

      - name: Verify regression is red before implementation
        shell: bash
        run: |
          set +e
          bash tests/test-selection-only.sh
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Capture baseline ShellCheck diagnostics
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -f json awtwall > /tmp/shellcheck-before.json || true
          else
            printf '[]\n' > /tmp/shellcheck-before.json
          fi

      - name: Apply selection-only implementation
        run: python3 .github/scripts/apply-selection-only-picker.py

      - name: Validate Bash syntax
        shell: bash
        run: bash -n awtwall

      - name: Validate focused contract
        shell: bash
        run: bash tests/test-selection-only.sh

      - name: Validate whitespace
        shell: bash
        run: git diff --check

      - name: ShellCheck focused regression
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            set +e
            shellcheck -f gcc tests/test-selection-only.sh 2>&1 | tee /tmp/shellcheck-focused.txt
            rc=${PIPESTATUS[0]}
            set -e
            test "$rc" -eq 0
          else
            : > /tmp/shellcheck-focused.txt
          fi

      - name: Upload focused ShellCheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-only-shellcheck
          path: /tmp/shellcheck-focused.txt
          if-no-files-found: ignore

      - name: ShellCheck app delta
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -f json awtwall > /tmp/shellcheck-after.json || true
            python3 - <<'PY'
          import collections
          import json

          def counts(path):
              with open(path, encoding='utf-8') as handle:
                  rows = json.load(handle)
              return collections.Counter((row['code'], row['message']) for row in rows)

          before = counts('/tmp/shellcheck-before.json')
          after = counts('/tmp/shellcheck-after.json')
          added = after - before
          if added:
              for (code, message), count in sorted(added.items()):
                  print(f'new ShellCheck diagnostic SC{code} x{count}: {message}')
              raise SystemExit(1)
          print('No new ShellCheck diagnostics relative to branch baseline')
          PY
          fi

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add awtwall tests/test-selection-only.sh
          git diff --cached --check
          git commit -m "Add selection-only picker mode [skip ci]"
          git push origin HEAD:feature/selection-only-picker
